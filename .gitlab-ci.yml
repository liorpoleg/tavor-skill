# .gitlab-ci.yml
# Tavor Automated Code Review Agent
# Runs on every merge request to review code against team conventions

stages:
  - review

automated-code-review:
  stage: review
  image: python:3.11
  
  script:
    # Install dependencies
    - pip install requests python-dotenv
    
    # Run the review script
    - python scripts/code-review.py
  
  only:
    - merge_requests  # Only run on merge requests
  
  # Environment variables stored in GitLab Settings → CI/CD → Variables
  variables:
    CLAUDE_API_URL: "${CLAUDE_API_URL}"      # Your local Claude API endpoint
    CLAUDE_API_KEY: "${CLAUDE_API_KEY}"      # Claude API key
    GITLAB_TOKEN: "${GITLAB_TOKEN}"          # GitLab personal access token
  
  allow_failure: true  # Don't block the pipeline if review fails

